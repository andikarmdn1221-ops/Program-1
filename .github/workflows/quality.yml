name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Scan tracked files for secrets
        run: python scripts/check_secrets.py
      - name: Compile source
        run: python -m compileall -q app.py wms tests scripts
      - name: Validate Apps Script syntax
        run: cp Code_Accounts.gs /tmp/Code_Accounts.js && node --check /tmp/Code_Accounts.js
      - name: Lint source
        run: python -m ruff check app.py wms tests scripts
      - name: Run tests
        run: python -m pytest
